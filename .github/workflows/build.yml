name: Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint code
        run: npm run lint:check || true
      
      - name: Type check
        run: npm run type-check || true
      
      - name: Run tests
        run: npm test || true
      
      - name: Build project
        run: npm run build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnifile-build
          path: dist/
          retention-days: 7
          compression-level: 9