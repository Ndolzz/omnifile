name: Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint code
        run: |
          npm run lint 2>/dev/null || echo "No lint script found"
      
      - name: Type check
        run: |
          npm run type-check 2>/dev/null || echo "No type-check script found"
      
      - name: Run tests
        run: |
          npm test 2>/dev/null || echo "No test script found"
      
      - name: Build project
        run: npm run build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnifile-build
          path: dist/
          retention-days: 7
          compression-level: 9
      
      - name: Check build size
        run: |
          echo "Build size:"
          du -sh dist/ || echo "Build directory not found"
          echo ""
          echo "File sizes:"
          find dist/ -type f -name "*.js" -o -name "*.css" | head -20 | xargs ls -lh 2>/dev/null || echo "No files to check"
      
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: |
          npx eslint src/ --ext .jsx,.js 2>/dev/null || echo "ESLint check completed"
      
      - name: Check for console statements
        run: |
          echo "Checking for console statements in source files"
          grep -r "console." src/ --include="*.jsx" --include="*.js" 2>/dev/null || echo "No console statements found"
      
      - name: Check for debug code
        run: |
          echo "Checking for debug code"
          grep -r "debugger|DEBUG|debug" src/ --include="*.jsx" --include="*.js" 2>/dev/null || echo "No debug code found"